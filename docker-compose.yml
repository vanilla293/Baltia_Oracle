# Baltia Oracle: docker compose up -d
#   лог:                 docker compose logs -f
#   остановить:          docker compose down
#   поменял .env:        docker compose up -d --force-recreate
#   обновил код:         docker compose up -d --build
#   вход userbot:        docker compose run --rm oracle python -m oracle.userbot_login
#
# ВАЖНО: выбери ОДНО — либо Docker, либо start.sh/start.bat, но не оба сразу. Контейнер с
# restart: unless-stopped работает в фоне невидимо; если потом запустить ещё и лаунчер, получится
# ДВЕ копии на одном токене — ответы начнут прыгать между ними, а обе будут писать в один
# ./data/oracle.db. Замок ./data/oracle.lock ловит и этот случай (одна из копий сразу выйдет).
# Забыл, что где-то крутится Docker? Проверь: docker compose ps  — и погаси: docker compose down.
services:
  oracle:
    build:
      context: .
      args:
        # 1 — поставить локальное распознавание голоса (faster-whisper, образ станет тяжелее)
        LOCAL_WHISPER: "0"
    image: baltia-oracle
    container_name: baltia-oracle
    env_file: .env
    environment:
      # В контейнере данные живут только в смонтированной ./data: путь из .env мимо неё попал бы
      # внутрь контейнера и стёрся бы при --force-recreate / --build. Пустые DB_PATH и USERBOT_SESSION —
      # oracle.db и userbot.session в этой же папке.
      DATA_DIR: /app/data
      DB_PATH: ""
      USERBOT_SESSION: ""
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    # Ollama / LM Studio на этой же машине:
    #   Windows / macOS (Docker Desktop): LLM_BASE_URL=http://host.docker.internal:11434/v1
    #   Linux: Ollama по умолчанию слушает только 127.0.0.1, и через host.docker.internal до неё не достучаться.
    #   Проще всего — убрать блок extra_hosts ниже, раскомментировать network_mode: host
    #   и писать LLM_BASE_URL=http://localhost:11434/v1 (подробно — README, «Совсем свободная модель»).
    # network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
